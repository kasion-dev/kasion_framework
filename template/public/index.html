<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>หน้าแรก</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="/vendor/vant.css">
<script src="/app.config.js"></script>
<script src="/kasion.js"></script>
<script src="/vendor/vue.js"></script>
<script src="/vendor/vant.js"></script>
<script src="/kasion.vue.js"></script>
<style>
.people{display:flex;gap:12px;overflow-x:auto;padding:0 2px 12px;scrollbar-width:none}
.people a{flex:0 0 64px;text-align:center;text-decoration:none;color:var(--kd-ink);font-size:12px;font-weight:700}
.people a span.n{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.note{display:flex;gap:10px;padding:12px;margin-bottom:8px}
.sec{font-size:13px;font-weight:800;color:var(--kd-mute);margin:2px 4px 8px}
</style>
</head>
<body>
<div id="app" class="k-app" v-cloak>
  <k-page :title="appName" tab="home">
    <template #right><van-tag round type="success" size="medium">{{ live.connected.value ? live.count.value + ' คนออนไลน์' : 'กำลังเชื่อมต่อ' }}</van-tag></template>
    <div class="k-pad">
      <template v-if="people.length">
        <div class="sec">ทักใครสักคน</div>
        <div class="people">
          <a v-for="u in people" :key="u.uid" :href="'/chat?with=m_' + encodeURIComponent(u.uid)">
            <k-avatar :src="u.photo" :name="u.name" :size="56" :online="u.online" style="margin: 0 auto"></k-avatar><span class="n">{{ u.name }}</span>
          </a>
        </div>
      </template>
      <van-field v-model="draft" placeholder="เขียนโน้ตถึงทุกคน…" maxlength="300" enterkeyhint="send" @keydown.enter.prevent="add" class="k-card" style="margin-bottom: 12px" aria-label="เขียนโน้ต">
        <template #button><van-button type="primary" size="small" round :loading="saving" @click="add">ส่ง</van-button></template>
      </van-field>
      <van-tabs v-model:active="route.who" type="card" style="margin-bottom: 12px">
        <van-tab title="ทั้งหมด" name="all"></van-tab><van-tab title="ของฉัน" name="mine"></van-tab>
      </van-tabs>
      <div v-if="loading" class="k-center"><van-loading size="28"></van-loading></div>
      <k-empty v-else-if="!shown.length" title="ยังไม่มีโน้ต" text="เขียนอันแรกได้เลย"></k-empty>
      <div v-for="n in shown" :key="n.id" class="k-card note" :class="{ 'k-new': n.id === fresh }">
        <k-avatar :src="n.author.photo" :name="n.author.name" :size="40"></k-avatar>
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 13px; font-weight: 800">{{ n.author.name }} <span style="font-weight: 600; color: var(--kd-mute)">· {{ timeAgo(n.at) }}</span></div>
          <div style="font-size: 15px; line-height: 1.5; word-break: break-word; white-space: pre-wrap">{{ n.text }}</div>
        </div>
        <van-icon v-if="n.mine" name="cross" size="18" color="#8A948F" role="button" tabindex="0" aria-label="ลบโน้ตนี้" @click="remove(n)" @keydown.enter="remove(n)"></van-icon>
      </div>
    </div>
  </k-page>
</div>
<script>
// Starter page — the patterns to copy: K.page, api(), K.live (realtime), route state in the URL, optimistic UI.
K.page({
  route: { who: 'all' },                      // ?who=mine survives refresh / Back
  setup({ user, route }) {
    const { ref, computed } = Vue;
    const notes = ref([]), people = ref([]), loading = ref(true), draft = ref(''), saving = ref(false), fresh = ref('');
    const load = K.onLoad(async () => { notes.value = (await api('/api/notes')).notes; loading.value = false; });
    K.onLoad(async () => { people.value = (await api('/api/users')).users.slice(0, 20); });
    // everyone on this page shares the 'notes' channel; reload after a reconnect
    const live = K.live('notes', {
      note(ev) { if (ev.by !== user.uid && !notes.value.some(x => x.id === ev.note.id)) { fresh.value = ev.note.id; notes.value.unshift(ev.note); sfx.play('receive', .5); } },
      note_deleted(ev) { notes.value = notes.value.filter(x => x.id !== ev.id); },
    }, load);
    const add = async () => {
      const text = draft.value.trim();
      if (!text || saving.value) return;
      saving.value = true;
      try { const d = await api('/api/notes', { method: 'POST', body: { text } }); draft.value = ''; fresh.value = d.note.id; notes.value.unshift(d.note); sfx.play('send', .7); }
      catch (e) { K.fail(e.message); }
      saving.value = false;
    };
    const remove = async (n) => { if (!(await K.confirm('ลบโน้ตนี้?'))) return; try { await api('/api/notes/' + n.id, { method: 'DELETE' }); notes.value = notes.value.filter(x => x.id !== n.id); } catch (e) { K.fail(e.message); } };
    const shown = computed(() => route.who === 'mine' ? notes.value.filter(n => n.mine) : notes.value);
    return { people, loading, draft, saving, fresh, live, add, remove, shown };
  }
});
</script>
</body>
</html>
