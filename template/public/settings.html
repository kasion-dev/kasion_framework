<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>ตั้งค่า</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="/vendor/vant.css">
<script src="/app.config.js"></script>
<script src="/kasion.js"></script>
<script src="/vendor/vue.js"></script>
<script src="/vendor/vant.js"></script>
<script src="/kasion.vue.js"></script>
</head>
<body>
<div id="app" class="k-app" v-cloak>
  <k-page title="ตั้งค่า" tab="settings">
    <div class="k-pad">
      <div class="k-card" style="display: flex; align-items: center; gap: 12px; padding: 14px; margin-bottom: 14px">
        <k-avatar :src="user.photo" :name="user.name" :size="56"></k-avatar>
        <div style="min-width: 0"><div style="font-weight: 800; font-size: 17px">{{ user.name }}</div><div style="font-size: 13px; color: var(--kd-mute)">{{ user.email }}</div></div>
      </div>
      <van-cell-group inset style="margin: 0">
        <van-cell title="การแจ้งเตือน" :label="pushHint" :value="pushLabel" is-link @click="enablePush"></van-cell>
        <van-cell title="เสียงเอฟเฟกต์" center><template #right-icon><van-switch :model-value="sound" @update:model-value="setSound" size="22"></van-switch></template></van-cell>
        <van-cell v-if="me.admin" title="ผู้ดูแลระบบ" :value="stats ? 'ผู้ใช้ ' + stats.users + ' คน' : '…'"></van-cell>
        <van-cell title="ออกจากระบบ" is-link title-style="color: #C92A2A; font-weight: 700" @click="signOut"></van-cell>
      </van-cell-group>
    </div>
  </k-page>
</div>
<script>
K.page({
  setup({ me }) {
    const { ref, computed } = Vue;
    const ps = ref(pushSetup.state()), sound = ref(sfx.on()), stats = ref(null);
    if (me.admin) K.onLoad(async () => { stats.value = await api('/api/admin/stats'); });
    return {
      sound, stats,
      pushLabel: computed(() => ({ granted: 'เปิดอยู่', denied: 'ถูกปิดไว้', unsupported: 'ไม่รองรับ' })[ps.value] || 'แตะเพื่อเปิด'),
      pushHint: computed(() => ps.value === 'unsupported' ? 'บน iPhone ต้องติดตั้งแอปที่หน้าโฮมก่อน' : ps.value === 'denied' ? 'เปิดสิทธิ์แจ้งเตือนในการตั้งค่าเบราว์เซอร์' : 'รับแจ้งเตือนข้อความใหม่ แม้ปิดแอปอยู่'),
      enablePush: async () => { const r = await pushSetup.enable(); ps.value = pushSetup.state(); K.toast(r === 'granted' ? 'เปิดการแจ้งเตือนแล้ว' : r === 'unsupported' ? 'อุปกรณ์นี้ยังไม่รองรับ' : r === 'denied' ? 'การแจ้งเตือนถูกปิดไว้ในเบราว์เซอร์' : 'เปิดการแจ้งเตือนไม่สำเร็จ'); },
      setSound: (v) => { sfx.set(v); sound.value = v; if (v) sfx.play('receive'); },
      signOut: async () => { if (!(await K.confirm('ออกจากระบบ?'))) return; try { await auth.signOut(); } catch (e) {} location.replace('/login'); },
    };
  }
});
</script>
</body>
</html>
